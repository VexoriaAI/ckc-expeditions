<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberKidz: Wasteland Expedition</title>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="src/main.js" type="module" defer></script>
</head>
<body>

    <header id="main-header">
        <div id="tezerium-display" style="visibility: hidden;">
            <span>💎</span> Tezerium: <span id="tezerium-balance">0</span>
        </div>
        <div id="wallet-status">
            <button id="header-connect-btn" class="action-btn small-btn">Connect Wallet</button>
            <span id="connection-status" style="display: none;">Connected</span>
        </div>
    </header>

    <main id="app-root">
        </main>

    <div id="item-select-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content modal-large">
            <h2 id="modal-item-title">Select Item</h2><button id="modal-item-close" class="modal-close-btn">X</button>
            <div id="modal-filter-bar" class="modal-filter-bar">
                <button class="modal-filter-btn active" data-filter="all">🔄</button>
                <button class="modal-filter-btn" data-filter="helmet" title="Helmets">🧢</button>
                <button class="modal-filter-btn" data-filter="weapon" title="Weapons">⚔️</button>
                </div>
            <div id="modal-item-grid" class="modal-item-grid"></div>
            <p id="modal-item-placeholder" style="display: none;">No items found.</p>
        </div>
    </div>

    <div id="edit-name-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content"><h2>Edit Kid Name</h2><input type="text" id="edit-name-input"><div class="modal-actions"><button id="edit-name-cancel" class="action-btn small-btn">Cancel</button><button id="edit-name-save" class="action-btn small-btn">Save</button></div></div>
    </div>
    
    <footer id="main-footer"><p>CyberKidz Club.</p></footer>

</body>
</html>
